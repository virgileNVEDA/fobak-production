{% extends 'health_base.html' %}{% set title='Modifier — ' ~ cfg.title %}{% block content %}
<section class="health-page-heading"><div><span>MODIFICATION</span><h1>{{ cfg.title }}</h1><p>Modifiez uniquement les informations nécessaires. L’opération est journalisée.</p></div><div class="health-page-actions"><a class="health-btn secondary" href="{{ url_for(cfg.endpoint) }}">← Retour</a></div></section>
<section class="health-panel health-form-panel"><form method="post" class="health-form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for name,label,kind in fields %}<label class="{{ 'full' if kind=='textarea' else '' }}">{{ label }}{% if kind=='textarea' %}<textarea name="{{ name }}" rows="4">{{ row[name] or '' }}</textarea>{% elif kind=='boolean' %}<select name="{{ name }}"><option value="1" {{ 'selected' if row[name] else '' }}>Oui / Actif</option><option value="0" {{ 'selected' if not row[name] else '' }}>Non / Inactif</option></select>{% elif kind.startswith('select:') %}<select name="{{ name }}">{% for opt in kind.split(':',1)[1].split('|') %}<option value="{{ opt }}" {{ 'selected' if (row[name]|string)==opt else '' }}>{{ opt }}</option>{% endfor %}</select>{% else %}<input type="{{ kind }}" name="{{ name }}" value="{{ row[name] if row[name] is not none else '' }}">{% endif %}</label>{% endfor %}<div class="full health-form-actions"><button class="health-btn" type="submit">Enregistrer les modifications</button></div></form></section>
{% endblock %}
