{% extends 'base.html' %}
{% block content %}
<section class="dashboard-welcome"><div><span class="eyebrow">Premier lancement</span><h1>Assistant de configuration</h1><p>Configurez les informations essentielles de la Fondation avant la publication.</p></div><div class="dashboard-seal">🧭</div></section>
<section class="card"><form method="post" enctype="multipart/form-data" class="form"><label>Nom de la Fondation <input name="structure_name" value="{{ settings.structure_name }}"></label><label>Devise <input name="structure_motto" value="{{ settings.structure_motto }}"></label><label>Description d’en-tête <input name="structure_header" value="{{ settings.structure_header }}"></label><label>Adresse officielle <textarea name="headquarters">{{ settings.headquarters }}</textarea></label><label>Téléphones <input name="contact_phones" value="{{ settings.contact_phones }}"></label><label>Président National <input name="president_name" value="{{ settings.president_name }}"></label><label>Secrétaire National <input name="secretary_name" value="{{ settings.secretary_name }}"></label><label>Site / domaine <input name="public_base_url" value="{{ settings.public_base_url }}"></label><label>Langue par défaut <select name="default_language">{% for code,label in lang_options.items() %}<option value="{{ code }}" {{ 'selected' if settings.default_language==code else '' }}>{{ label }}</option>{% endfor %}</select></label><label>Logo <input type="file" name="logo" accept="image/*"></label><button class="btn primary">Terminer la configuration</button></form></section>
{% endblock %}
