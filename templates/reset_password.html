{% extends 'base.html' %}
{% block content %}
<section class="auth-card card">
  <h1>Modifier le mot de passe oublié</h1>
  <p>Entrez l'e-mail et le téléphone enregistrés, puis choisissez un nouveau mot de passe.</p>
  <form method="post" class="form">
    <label>E-mail <input type="email" name="email" required></label>
    <label>Téléphone <input name="phone" required></label>
    <label>Nouveau mot de passe <input type="password" name="new_password" minlength="6" required></label>
    <button class="btn primary" type="submit">Modifier</button>
  </form>
</section>
{% endblock %}
